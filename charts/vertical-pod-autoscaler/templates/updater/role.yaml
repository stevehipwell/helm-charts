{{- if and .Values.rbac.create (not .Values.recommenderOnly) (gt (int .Values.updater.replicas) 1) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vertical-pod-autoscaler.updater.fullname" . }}-leader-locking
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vertical-pod-autoscaler.updater.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resourceNames:
      - {{ .Values.updater.leaderElect.name }}
    resources:
      - leases
    verbs:
      - get
      - watch
      - update
{{- end -}}
