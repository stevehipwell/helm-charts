{{- if and .Values.rbac.create (gt (int .Values.recommender.replicas) 1) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vertical-pod-autoscaler.recommender.fullname" . }}-leader-locking
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vertical-pod-autoscaler.recommender.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vertical-pod-autoscaler.recommender.fullname" . }}-leader-locking
subjects:
  - kind: ServiceAccount
    name: {{ include "vertical-pod-autoscaler.recommender.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
