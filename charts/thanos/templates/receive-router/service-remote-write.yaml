{{- if and .Values.receive.enabled .Values.receive.router.remoteWriteService.enabled -}}
{{- $svc := .Values.receive.router.remoteWriteService -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-remote-write" (include "thanos.receive.router.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thanos.receive.router.labels" . | nindent 4 }}
  {{- with $svc.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
{{- if has $svc.type (list "NodePort" "LoadBalancer") }}
{{- with $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
{{- end }}
{{- end }}
{{- if eq $svc.type "LoadBalancer" }}
{{- with $svc.loadBalancerClass }}
  loadBalancerClass: {{ . }}
{{- end }}
{{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
  ports:
    - name: http-rem-write
      protocol: TCP
      port: {{ $svc.port }}
      targetPort: http-rem-write
      {{- if has $svc.type (list "NodePort" "LoadBalancer") }}
      {{- with $svc.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- end }}
  selector:
    {{- include "thanos.receive.router.selectorLabels" . | nindent 4 }}
{{- end }}
